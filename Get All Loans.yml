info:
  name: Get All Loans
  type: http
  seq: 15

http:
  method: GET
  url: http://localhost:8000/api/loan
  headers:
    - name: Authorization
      value: "{{token}}"
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

